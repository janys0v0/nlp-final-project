[project]
name = "power-sampling"
version = "0.1.0"
description = "Power-sampling MCMC over base LMs (MIT 6.8610 final project, reproducing arXiv 2510.14901)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.1",
    "transformers>=4.45",
    "accelerate>=0.30",
    "datasets>=2.20",
    "numpy",
    "pandas",
    "tqdm",
    "pyyaml",
]

[project.optional-dependencies]
gpu = [
    "bitsandbytes; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "nbstripout",
    "ruff",
    "pytest",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["power_sampling"]
